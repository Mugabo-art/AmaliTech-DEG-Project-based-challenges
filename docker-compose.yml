services:
  api:
    build: .
    image: kora-analytics-api
    init: true
    # Read the settings (PORT and HOST_PORT) from the .env file
    env_file: .env
    # Outside door : app's door, both taken from .env
    ports:
      - "${HOST_PORT}:${PORT}"
    restart: unless-stopped
    # Every 30 seconds, ask the app for /health from inside the container
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    # Keep the logs on disk to read later, capped at 3 files of 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
