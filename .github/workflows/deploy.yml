name: Deploy

# Run this pipeline every time code is pushed to the main branch
on:
  push:
    branches: [main]
jobs:
  # Job 1: run the tests. If they fail, nothing is built or deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository's code onto GitHub's computer
      - uses: actions/checkout@v5

      # Install Node.js 22, the same version the Dockerfile uses
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Install the exact library versions from package-lock.json
      - run: npm ci
        working-directory: app

      # Run the app's 4 tests
      - run: npm test
        working-directory: app

          # Job 2: build the image and upload it to the ECR shelf. Runs only if the tests passed.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Download the code again (every job starts on a fresh, empty computer)
      - uses: actions/checkout@v5

      # Log in to AWS as github-actions-deployready, using the keys from GitHub secrets
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # Log Docker in to the ECR shelf
      - uses: aws-actions/amazon-ecr-login@v2

      # Build the image, label it with this commit's ID, and upload it to the shelf
      - run: |
          docker build -t 413724559765.dkr.ecr.eu-west-1.amazonaws.com/kora-analytics-api:${{ github.sha }} .
          docker push 413724559765.dkr.ecr.eu-west-1.amazonaws.com/kora-analytics-api:${{ github.sha }}